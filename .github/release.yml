changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 Features & Enhancements
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧰 Maintenance & Under the Hood
      labels:
        - maintenance
    - title: Other Changes
      labels:
        - "*"
