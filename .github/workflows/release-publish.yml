name: Release / Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cnsplots/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-draft:
    name: Draft GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous tag
        id: previous-tag
        run: |
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          previous_tag=""

          if git rev-parse "${tag_commit}^" >/dev/null 2>&1; then
            previous_tag="$(git describe --tags --abbrev=0 "${tag_commit}^" 2>/dev/null || true)"
          fi

          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check for existing release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create draft GitHub release
        if: steps.existing-release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous-tag.outputs.previous_tag }}
        run: |
          summary_template=$(cat <<'EOF'
          ## Summary

          ### Added
          - _Add release highlights here._

          ### Changed
          - _Add release highlights here._

          ### Fixed
          - _Add release highlights here._
          EOF
          )

          args=(
            release create "${GITHUB_REF_NAME}"
            --verify-tag
            --draft
            --generate-notes
            --notes "${summary_template}"
          )

          if [ -n "${PREVIOUS_TAG}" ]; then
            args+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi

          gh "${args[@]}"
