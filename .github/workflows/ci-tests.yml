name: CI / Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Run lint
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Install mutool
        run: |
          sudo apt-get update
          sudo apt-get install -y mupdf-tools

      - name: Verify export renderers
        run: |
          mutool -v
          google-chrome --version

      - name: Run tests
        id: tests
        run: make test

      - name: Upload export regression results
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: export-results-linux-python-${{ matrix.python-version }}
          path: mpl-results/export-pipeline/
          if-no-files-found: warn

      - name: Run visual regression tests
        if: ${{ matrix.python-version == '3.12' }}
        id: visual_tests
        env:
          CNSPLOTS_REQUIRE_VISUAL_ENV: "1"
        run: make test-visual

      - name: Upload visual regression results
        if: ${{ always() && steps.visual_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpl-results-python-3.12
          path: mpl-results/
          if-no-files-found: warn

  platform-smoke:
    name: Smoke / ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/uv-python
      UV_PYTHON_PREFERENCE: only-managed
      TMPDIR: ${{ github.workspace }}/.cache/tmp
      TEMP: ${{ github.workspace }}/.cache/tmp
      TMP: ${{ github.workspace }}/.cache/tmp
    steps:
      - uses: actions/checkout@v5

      - name: Prepare local temporary directory
        run: mkdir -p "$TMPDIR"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Run platform smoke tests
        id: smoke_tests
        run: >-
          uv run pytest --no-cov -ra
          --basetemp=mpl-results/platform-smoke
          tests/test_platform_smoke.py
          tests/test_font_cache.py
          tests/test_export_pipeline.py
          tests/test_svg_font_weights.py
          tests/test_svg_masks.py
          tests/test_figure_exports.py

      - name: Upload export regression results
        if: ${{ always() && steps.smoke_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: export-results-${{ matrix.os }}-python-3.12
          path: mpl-results/
          if-no-files-found: warn

  docs:
    name: docs-validation
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Build docs
        run: make doc

      - name: Check docs links
        run: make doc-linkcheck
  package:
    name: package-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv .pkg-venv
          . .pkg-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import cnsplots; print(cnsplots.__version__)"
          python -c "from importlib.resources import files; assert files('cnsplots').joinpath('py.typed').is_file()"
          python -c "from importlib.resources import files; root = files('cnsplots.datasets').joinpath('_data'); image = root.joinpath('showcase').joinpath('image1.webp'); assert root.joinpath('iris.csv').is_file(); assert image.read_bytes()[:4] == b'RIFF'"
          python -c "import cnsplots; assert cnsplots.datasets.load_dataset('iris').shape == (150, 5)"
          python -m pip check
