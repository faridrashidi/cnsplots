name: CI / Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install mutool
        run: |
          sudo apt-get update
          sudo apt-get install -y mupdf-tools

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest --disable-warnings ./tests
