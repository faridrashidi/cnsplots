name: CI / Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --locked --extra lint

      - name: Run lint
        run: make lint

      - name: Validate workflow contracts
        run: uv run --locked --extra lint pytest tests/test_release_workflow.py --no-cov

  validation:
    uses: ./.github/workflows/validate-package.yml

  platform-smoke:
    name: Smoke / ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/uv-python
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v5

      - name: Prepare local test directories
        run: |
          mkdir -p .cache/tmp mpl-results
          for name in TMPDIR TEMP TMP; do
            printf '%s=%s/.cache/tmp\n' "$name" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          done

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --extra test

      - name: Run platform smoke tests
        id: smoke_tests
        run: >-
          uv run --locked --extra test pytest --no-cov -ra
          --basetemp=mpl-results/platform-smoke
          tests/test_platform_smoke.py
          tests/test_font_cache.py
          tests/test_export_pipeline.py
          tests/test_svg_font_weights.py
          tests/test_svg_masks.py
          tests/test_figure_exports.py

      - name: Upload export regression results
        if: ${{ always() && steps.smoke_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: export-results-${{ matrix.os }}-python-3.12
          path: mpl-results/
          if-no-files-found: warn

  docs:
    name: docs-validation
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --locked --extra docs

      - name: Build docs
        run: make doc

      - name: Check docs links
        run: make doc-linkcheck
