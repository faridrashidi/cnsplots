name: CI / Docs

on:
  workflow_run:
    workflows:
      - CI / Tests
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      CNSPLOTS_DOCS_FONT: Liberation Sans
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install docs fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation
      - name: Sync docs dependencies
        run: uv sync --extra doc
      - name: Verify docs font
        run: |
          fc-match "${CNSPLOTS_DOCS_FONT}"
          uv run python - <<'PY'
          import os
          from matplotlib import font_manager as fm

          docs_font = os.environ["CNSPLOTS_DOCS_FONT"]
          font_path = fm.findfont(docs_font, fallback_to_default=False)
          print(f"{docs_font}: {font_path}")
          PY
      - name: Build documentation
        run: uv run sphinx-build -b html docs docs/build/html
      # Keep the custom domain in GitHub Pages settings, not as a committed CNAME file.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
