name: CI / Docs

on:
  workflow_run:
    workflows:
      - CI / Tests
    types:
      - completed
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'workflow_run' }}
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 0
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Sync docs dependencies
        run: uv sync --extra dev
      - name: Prepare multiversion refs
        run: |
          git fetch --force --tags origin +refs/heads/main:refs/remotes/origin/main
          git branch -f dev origin/main
      - name: Verify docs font
        run: |
          uv run python - <<'PY'
          import matplotlib as mpl

          import cnsplots as cns
          from matplotlib import font_manager as fm

          cns.settings.reset()
          cns.setup_matplotlib()
          assert cns.settings.font_sans_serif == (
              "Helvetica",
              "Helvetica Neue",
              "Arial",
              "DejaVu Sans",
          )
          assert cns.settings.panel_label_fontname == "Helvetica"
          font_props = fm.FontProperties(
              family=mpl.rcParams["font.family"],
              style="normal",
              weight="normal",
          )
          font_path = fm.findfont(font_props, fallback_to_default=False)
          resolved_name = fm.FontProperties(fname=font_path).get_name()
          print(f"{resolved_name} -> {font_path}")
          assert resolved_name == "Helvetica"
          PY
      - name: Build versioned documentation
        run: uv run python docs/_scripts/build_versioned_docs.py docs/build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
