name: CI / Docs

on:
  workflow_run:
    workflows:
      - CI / Tests
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Sync docs dependencies
        run: uv sync --extra dev
      - name: Verify docs font
        run: |
          uv run python - <<'PY'
          import matplotlib as mpl

          import cnsplots as cns
          from matplotlib import font_manager as fm

          cns.settings.reset()
          cns.setup_matplotlib()
          assert cns.settings.font_sans_serif == (
              "Helvetica",
              "Helvetica Neue",
              "Arial",
              "DejaVu Sans",
          )
          assert cns.settings.panel_label_fontname == "Helvetica"
          font_props = fm.FontProperties(
              family=mpl.rcParams["font.family"],
              style="normal",
              weight="normal",
          )
          font_path = fm.findfont(font_props, fallback_to_default=False)
          resolved_name = fm.FontProperties(fname=font_path).get_name()
          print(f"{resolved_name} -> {font_path}")
          assert resolved_name == "Helvetica"
          PY
      - name: Build documentation
        run: uv run sphinx-build -b html docs docs/build/html
      # Keep the custom domain in GitHub Pages settings, not as a committed CNAME file.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
