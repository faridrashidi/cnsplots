name: CI / Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Sync docs dependencies
        run: uv sync --locked --extra dev
      - name: Prepare multiversion refs
        run: |
          git fetch --force --tags origin +refs/heads/main:refs/remotes/origin/main
          git branch -f dev origin/main
      - name: Select docs build mode
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "DOCS_BUILD_MODE=release" >> "${GITHUB_ENV}"
          else
            echo "DOCS_BUILD_MODE=main" >> "${GITHUB_ENV}"
          fi
      - name: Verify docs font
        run: |
          uv run python - <<'PY'
          import matplotlib as mpl

          import cnsplots as cns
          from matplotlib import font_manager as fm

          cns.settings.reset()
          cns.setup_matplotlib()
          assert cns.settings.font_sans_serif == (
              "Helvetica",
              "Helvetica Neue",
              "Arial",
              "DejaVu Sans",
          )
          assert cns.settings.panel_label_fontname == "Helvetica"
          font_props = fm.FontProperties(
              family=mpl.rcParams["font.family"],
              style="normal",
              weight="normal",
          )
          font_path = fm.findfont(font_props, fallback_to_default=False)
          resolved_name = fm.FontProperties(fname=font_path).get_name()
          print(f"{resolved_name} -> {font_path}")
          assert resolved_name == "Helvetica"
          PY
      - name: Build versioned documentation
        run: |
          rm -rf site-build
          uv run python docs/_scripts/build_versioned_docs.py \
            --mode "${DOCS_BUILD_MODE}" \
            site-build
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site-build
          clean: true
          single-commit: true
          commit-message: Deploy documentation for ${{ github.sha }}
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
