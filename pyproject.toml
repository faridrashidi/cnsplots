[project]
name = "cnsplots"
version = "0.0.0"
description = "A comprehensive plotting library for bioinformatics and data visualization"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9,<4.0"
keywords = ["plotting", "visualization", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "adjustText",
    "biopython",
    "glasbey",
    "gseapy",
    "lifelines",
    "lxml",
    "matplotlib",
    "matplotlib-venn",
    "natsort",
    "num2tex",
    "numba>=0.58.1",
    "numpy",
    "palettable",
    "pandas",
    "pycomplexheatmap",
    "scanpy",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statannotations",
    "statsmodels",
    "upsetplot",
]

[project.optional-dependencies]
dev = [
    "bump-my-version",
    "fastcluster",
    "ipykernel",
    "pre-commit",
    "pytest",
    "pytest-cov",
]
doc = [
    "furo",
    "myst-parser",
    "sphinx<9",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-gallery",
    "sphinx-hoverxref",
]

[project.urls]
Homepage = "https://github.com/faridrashidi/cnsplots"
Documentation = "https://cnsplots.readthedocs.io"
Repository = "https://github.com/faridrashidi/cnsplots"
Issues = "https://github.com/faridrashidi/cnsplots/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["cnsplots"]

[tool.ruff.format]
docstring-code-format = true

[tool.rstcheck]
report_level = "info"
ignore_messages = '( No directive entry for.*|Hyperlink target.*|Unknown target name:.*|No (directive|role) entry for "(auto)?(class|method|property|function|func|mod|module)" in module "docutils\.parsers\.rst\.languages\.en"\.)'

[tool.bumpversion]
current_version = "0.0.0"
commit = true
message = "chore(release): 🔖 Bump version {current_version} -> {new_version}"
tag = true
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/cnsplots/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.ty.src]
exclude = ["examples/", "docs/"]

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"

[tool.codespell]
skip = ".git,.venv,*.lock"
ignore-words-list = "thur,whis,fpr,socio-economic"
