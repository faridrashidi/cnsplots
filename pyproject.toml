[project]
name = "cnsplots"
version = "0.0.1"
description = ""
requires-python = ">=3.8,<4.0"
dependencies = [
    "adjustText",
    "lifelines",
    "lxml",
    "matplotlib",
    "matplotlib-venn",
    "natsort",
    "num2tex",
    "numpy",
    "palettable",
    "pandas",
    "pycomplexheatmap",
    "scikit-learn",
    "scipy",
    "seaborn",
    "upsetplot",
    "statannotations @ git+https://github.com/trevismd/statannotations@master",
]

[project.optional-dependencies]
doc = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-gallery",
    "sphinx-hoverxref",
    "sphinx_design",
]
dev = [
    "scanpy",
    "pre-commit",
    "cmprsk",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cnsplots"]
